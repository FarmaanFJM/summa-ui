<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application sidebar rail preset (candidate)</title>
<link rel="stylesheet" href="../../../../../guidance/css/tokens.css">
<link rel="stylesheet" href="../../../../../guidance/css/presets.css">
<link rel="stylesheet" href="../css/workspace-presets.css">
<style>
  /* Page chrome only. The sidebar uses sm- classes. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--s0); color: var(--text); font: 400 var(--fs)/1.5 var(--font); }
  main { flex: 1; min-width: 0; margin: 8px 8px 8px 0; padding: 24px; background: var(--s1); border-radius: var(--r-xl); }
  .sm-app-sidebar { height: 100%; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<aside class="sm-app-sidebar" id="side" data-mode="compact" aria-label="Application">
  <div class="sm-app-sidebar__brand"><span aria-hidden="true">S</span><span class="sm-app-sidebar__label">Summa</span></div>
  <nav class="sm-app-sidebar__nav" aria-label="Primary">
    <button type="button" class="sm-nav-item" aria-current="true" title="Review"><svg class="sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg><span class="sm-app-sidebar__label">Review</span></button>
    <button type="button" class="sm-nav-item" title="Documents"><svg class="sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg><span class="sm-app-sidebar__label">Documents</span></button>
  </nav>
  <div class="spacer"></div>
  <div class="sm-app-sidebar__foot">
    <button type="button" class="sm-nav-item" id="width" aria-pressed="false" aria-label="Expand navigation" title="Expand navigation"><svg class="sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg><span class="sm-app-sidebar__label">Collapse</span></button>
  </div>
</aside>
<main><h1 style="margin:0;font-size:var(--fs-lg)">Workspace page</h1></main>
<script>
  var side = document.getElementById('side'), btn = document.getElementById('width');
  btn.addEventListener('click', function () {
    var compact = side.dataset.mode === 'compact'; side.dataset.mode = compact ? 'expanded' : 'compact';
    var label = compact ? 'Collapse navigation' : 'Expand navigation'; btn.setAttribute('aria-label', label); btn.title = label; btn.setAttribute('aria-pressed', String(compact));
  });
</script>
</body>
</html>
